<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Taller</title>
  <style>
    /* Styles from src/App.css */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-primary: #ffffff;
      --text-secondary: #aaaaaa;
      --accent-color: #00d4ff;
      --input-bg: #2c2c2c;
      --input-border: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, Avenir, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
      margin: 0;
      color: var(--accent-color);
    }

    header p {
      margin: 5px 0 0;
      color: var(--text-secondary);
    }

    .card {
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    .result-area {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #333;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .result-box.primary .label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .result-box.primary .value {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent-color);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .result-box.secondary {
      margin-top: 10px;
    }

    .result-box.secondary .value-sm {
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    .placeholder-text {
      color: #555;
      font-style: italic;
    }

    footer {
      text-align: center;
      margin-top: auto;
      padding-top: 20px;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Calculadora de Bobinas</h1>
      <p>Desarrollo y Longitud</p>
    </header>

    <main class="card">
      <div class="input-group">
        <label for="dout">Diámetro Exterior (mm)</label>
        <input id="dout" type="number" inputmode="decimal" placeholder="Ej. 120" />
      </div>

      <div class="input-group">
        <label for="din">Diámetro Interior (mm)</label>
        <input id="din" type="number" inputmode="decimal" placeholder="Ej. 50" />
      </div>

      <div class="input-group">
        <label for="turns">Número de Vueltas</label>
        <input id="turns" type="number" inputmode="decimal" placeholder="Ej. 25" />
      </div>

      <div class="result-area" id="result-area">
        <div class="placeholder-text">
          Introduce los datos para calcular
        </div>
      </div>
    </main>

    <footer>
      <p>Taller v1.0 • PWA Ready</p>
      <p style="font-size: 0.7em; margin-top: 5px;">Single File Built</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dOutInput = document.getElementById('dout');
      const dInInput = document.getElementById('din');
      const turnsInput = document.getElementById('turns');
      const resultArea = document.getElementById('result-area');

      function calculate() {
        const dOut = parseFloat(dOutInput.value);
        const dIn = parseFloat(dInInput.value);
        const turns = parseFloat(turnsInput.value);

        if (!isNaN(dOut) && !isNaN(dIn) && !isNaN(turns)) {
          // Formula: L = pi * N * ((Do + Di) / 2)
          const avgDiameter = (dOut + dIn) / 2;
          const lengthMm = Math.PI * turns * avgDiameter;
          const lengthM = lengthMm / 1000;

          const mm = lengthMm.toFixed(2);
          const m = lengthM.toFixed(3);

          resultArea.innerHTML = `
            <div class="result-box primary">
              <span class="label">Longitud Total</span>
              <span class="value">${m} m</span>
            </div>
            <div class="result-box secondary">
              <span class="value-sm">${mm} mm</span>
            </div>
          `;
        } else {
          resultArea.innerHTML = `
            <div class="placeholder-text">
              Introduce los datos para calcular
            </div>
          `;
        }
      }

      dOutInput.addEventListener('input', calculate);
      dInInput.addEventListener('input', calculate);
      turnsInput.addEventListener('input', calculate);
    });
  </script>
</body>

</html>
